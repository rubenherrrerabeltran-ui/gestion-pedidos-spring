<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Pedidos')}"></head>
<body>
<header th:replace="~{fragmentos :: encabezado}"></header>
<main class="contenido">
    <th:block th:replace="~{fragmentos :: mensajes}"></th:block>
    <section class="encabezado-pagina">
        <div>
            <h1 th:text="${usuarioActual.rol.name() == 'CLIENTE'} ? 'Mis pedidos' : 'Pedidos'">Pedidos</h1>
            <p class="ayuda">Pedidos con sus detalles leídos en una sola consulta (JOIN) por el repositorio.</p>
        </div>
        <a class="boton boton-principal" th:href="@{/pedidos/nuevo}">+ Nuevo pedido</a>
    </section>
    <table class="tabla">
        <thead><tr><th>#</th><th>Cliente</th><th>Fecha</th><th class="num">Productos</th><th>Estado</th>
            <th class="num">Total</th><th></th></tr></thead>
        <tbody>
        <tr th:each="p : ${pedidos}">
            <td th:text="${p.idPedido}">1</td>
            <td th:text="${p.nombreCliente}">Cliente</td>
            <td th:text="${#temporals.format(p.fechaPedido, 'dd/MM/yyyy HH:mm')}">fecha</td>
            <td class="num" th:text="${#lists.size(p.detalles)}">0</td>
            <td><span class="estado" th:classappend="'estado-' + ${p.estado.codigoBd}" th:text="${p.estado}">ESTADO</span></td>
            <td class="num" th:text="'$ ' + ${#numbers.formatDecimal(p.calcularTotal(), 1, 'POINT', 0, 'COMMA')}">0</td>
            <td><a class="boton boton-pequeno" th:href="@{/pedidos/{id}(id=${p.idPedido})}">Ver detalle</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="7" class="vacio">No hay pedidos registrados.</td></tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
