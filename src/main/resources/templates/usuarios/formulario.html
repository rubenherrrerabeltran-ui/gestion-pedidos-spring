<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza(${usuario.idUsuario == null} ? 'Nuevo usuario' : 'Editar usuario')}"></head>
<body>
<header th:replace="~{fragmentos :: encabezado}"></header>
<main class="contenido">
    <th:block th:replace="~{fragmentos :: mensajes}"></th:block>
    <section class="tarjeta-formulario">
        <h1 th:text="${usuario.idUsuario == null} ? 'Nuevo usuario' : 'Editar usuario #' + ${usuario.idUsuario}">Usuario</h1>
        <form class="formulario" method="post" th:action="@{/usuarios/guardar}" th:object="${usuario}" autocomplete="off">
            <input type="hidden" th:field="*{idUsuario}">
            <th:block th:replace="~{fragmentos :: camposPersona}"></th:block>
            <label for="clave" th:text="${usuario.idUsuario == null} ? 'Contraseña' : 'Nueva contraseña (vacío = no cambiar)'">Contraseña</label>
            <input type="password" th:field="*{clave}" th:required="${usuario.idUsuario == null}" minlength="8" maxlength="64"
                   title="8 a 64 caracteres con al menos una letra y un número">
            <label for="rol">Rol</label>
            <select th:field="*{rol}">
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROL</option>
            </select>
            <div class="botones">
                <button type="submit" class="boton boton-principal">Guardar</button>
                <a class="boton boton-claro" th:href="@{/usuarios}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
