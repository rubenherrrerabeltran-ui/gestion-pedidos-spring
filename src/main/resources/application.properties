# =============================================================================
# Configuración principal - Sistema de gestión de pedidos (Spring Boot)
# Almacenamiento: MySQL 8. Las credenciales se pueden sobrescribir con variables
# de entorno (DB_URL, DB_USUARIO, DB_CLAVE) para no guardarlas en el repositorio.
# =============================================================================
spring.application.name=gestion-pedidos-spring
server.port=8080

# --- Base de datos MySQL -----------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sena_gestion_pedidos?createDatabaseIfNotExist=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_CLAVE:}

# Crea las tablas (IF NOT EXISTS) y carga los datos de prueba al iniciar
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8

# --- Vistas Thymeleaf --------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# --- Sesión y codificación ---------------------------------------------------
server.servlet.session.timeout=30m
# La sesión viaja solo en la cookie JSESSIONID (nunca en la URL)
server.servlet.session.tracking-modes=cookie
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
