# =============================================================================
# Perfil "demo": ejecuta la aplicación sin instalar MySQL, con H2 en memoria en
# modo de compatibilidad MySQL. Activar con: --spring.profiles.active=demo
# =============================================================================
spring.datasource.url=jdbc:h2:mem:gestion_pedidos;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
